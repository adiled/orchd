name: containerd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  grow-and-fell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install orch, the parser orchd runs
        run: cargo install the-orch --locked --version "~0.3"
      - name: Build orchd and its rootstocks
        run: just build
      - name: containerd is running, with the CNI plugins
        env:
          CNI_VERSION: v1.9.1
        run: |
          sudo ctr version
          curl -fsSLO "https://github.com/containernetworking/plugins/releases/download/$CNI_VERSION/cni-plugins-linux-amd64-$CNI_VERSION.tgz"
          curl -fsSL "https://github.com/containernetworking/plugins/releases/download/$CNI_VERSION/cni-plugins-linux-amd64-$CNI_VERSION.tgz.sha256" | sha256sum -c
          sudo mkdir -p /opt/cni/bin
          sudo tar -xzf "cni-plugins-linux-amd64-$CNI_VERSION.tgz" -C /opt/cni/bin
          sudo zig-out/bin/orchd-rootstock-containerd check
      - name: Grow on containerd, see it run and publish, fell it, find nothing left
        run: |
          set -eu
          B=$PWD/zig-out/bin
          T=$(mktemp -d)
          echo "T=$T" >> "$GITHUB_ENV"
          mkdir -p $T/proj/note $T/proj/site
          echo "mounted from the host" > $T/proj/note/note
          echo "published from the tree" > $T/proj/site/index.html
          cat > $T/proj/Orchfile <<'ORCH'
          ORCH_VERSION 1.0.0-rc
          ARG ORCH_PROJECT=~/proj

          SERVICE hello
          FROM alpine:3.20
          CMD sh -c "echo hello from $GREETING; cat /data/note; touch /data/x 2>/dev/null && echo note is writable || echo note is read-only; sleep 600"
          ENV GREETING=containerd
          VOLUME ${ORCH_PROJECT}/note:/data:ro

          SERVICE web
          FROM nginx:alpine
          PUBLISH 127.0.0.1:18080:80
          VOLUME ${ORCH_PROJECT}/site:/usr/share/nginx/html
          ORCH
          o() { sudo env PATH="$PATH" "$B/orchd" --project-dir $T/proj --state-dir $T/state --grove ci --rootstock containerd --platform orchdi --system "$@"; }
          o grow
          for i in $(seq 1 90); do sudo ctr -n ci tasks ls | grep -q "ci-hello.*RUNNING" && break; sleep 1; done
          sudo ctr -n ci tasks ls | grep "ci-hello.*RUNNING"
          o survey
          sleep 2
          sudo cat $T/state/logs/ci.hello.log
          sudo grep -q "hello from containerd" $T/state/logs/ci.hello.log
          sudo grep -q "mounted from the host" $T/state/logs/ci.hello.log
          sudo grep -q "note is read-only" $T/state/logs/ci.hello.log
          test ! -e $T/proj/note/x
          for i in $(seq 1 60); do curl -fsS -m 2 http://127.0.0.1:18080/ && break; sleep 1; done
          test "$(curl -fsS -m 2 http://127.0.0.1:18080/)" = "published from the tree"
          ! curl -fsS -m 2 "http://$(hostname -I | cut -d' ' -f1):18080/"
          o fell
          test -z "$(sudo ctr -n ci tasks ls -q)"
          test -z "$(sudo ctr -n ci containers ls -q)"
          ! sudo ctr -n ci snapshots ls | grep -q ci-hello
          test -z "$(sudo ls /run/orchd/netns)"
          echo "grown, seen running, published on loopback only, felled, nothing left"
      - name: What containerd and the tree said
        if: failure()
        run: |
          sudo journalctl -u containerd --no-pager | tail -60
          sudo sh -c "tail -50 $T/state/logs/*.log" || true
