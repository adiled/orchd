name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  build-and-release:
    needs: [publish-crate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Locate built binary
        id: binary
        run: |
          bin="target/x86_64-unknown-linux-gnu/release/orchd"
          echo "BIN=$bin" >> "$GITHUB_ENV"
          [[ -f "$bin" ]] || { echo "missing $bin" >&2; exit 1; }

      - name: Package binary
        run: |
          mkdir -p dist
          cp "$BIN" dist/orchd
          tar czf orchd-x86_64-linux.tar.gz -C dist orchd
          echo "ARCHIVE=orchd-x86_64-linux.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchd-x86_64-linux.tar.gz
          path: orchd-x86_64-linux.tar.gz
          if-no-files-found: error

  release:
    needs: [publish-crate, build-and-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: orchd-x86_64-linux.tar.gz

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            orchd-x86_64-linux.tar.gz
