name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "justfile"

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-linux
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install orch, the parser orchd runs
        run: cargo install the-orch --locked
      - run: just test
      - run: just dist
      - run: tar -czf orchd-${{ matrix.target }}.tar.gz -C dist bin
      - uses: actions/upload-artifact@v7
        with:
          name: orchd-${{ matrix.target }}
          path: orchd-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*.tar.gz
