name: cri

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  grow-and-fell:
    runs-on: ubuntu-latest
    env:
      CRIO_VERSION: v1.37.3
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: extractions/setup-just@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install orch, the parser orchd runs
        run: cargo install the-orch --locked
      - name: Build orchd and its rootstocks
        run: just build
      - name: Install and start CRI-O
        run: |
          curl -fsSLO "https://storage.googleapis.com/cri-o/artifacts/cri-o.amd64.$CRIO_VERSION.tar.gz"
          curl -fsSL "https://storage.googleapis.com/cri-o/artifacts/cri-o.amd64.$CRIO_VERSION.tar.gz.sha256sum" | sha256sum -c
          tar -xzf "cri-o.amd64.$CRIO_VERSION.tar.gz"
          (cd cri-o && sudo ./install)
          sudo systemctl daemon-reload
          sudo systemctl start crio
          sudo crictl --runtime-endpoint unix:///run/crio/crio.sock version
      - name: The rootstock finds CRI-O, past Docker's containerd
        run: sudo zig-out/bin/orchd-rootstock-cri check
      - name: Grow a service on CRI-O, see it run, fell it, find nothing left
        run: |
          set -eu
          B=$PWD/zig-out/bin
          T=$(mktemp -d)
          echo "T=$T" >> "$GITHUB_ENV"
          mkdir -p $T/proj/note
          echo "mounted from the host" > $T/proj/note/note
          cat > $T/proj/Orchfile <<'ORCH'
          ORCH_VERSION 1.0.0-rc

          SERVICE hello
          FROM alpine:3.20
          CMD sh -c "echo hello from $GREETING; cat /data/note; sleep 600"
          ENV GREETING=cri
          VOLUME ./note:/data
          ORCH
          o() { sudo env PATH="$PATH" "$B/orchd" --project-dir $T/proj --state-dir $T/state --grove ci --rootstock cri --platform orchdi --system "$@"; }
          c() { sudo crictl --runtime-endpoint unix:///run/crio/crio.sock "$@"; }
          o grow
          for i in $(seq 1 90); do c ps --label orchd.grove=ci --state running -q | grep -q . && break; sleep 1; done
          c pods --label orchd.grove=ci
          c ps --label orchd.grove=ci --state running -q | grep -q .
          o survey
          sleep 2
          sudo cat $T/state/logs/ci.hello.log
          sudo grep -q "hello from cri" $T/state/logs/ci.hello.log
          sudo grep -q "mounted from the host" $T/state/logs/ci.hello.log
          o fell
          test -z "$(c pods --label orchd.grove=ci -q)"
          test -z "$(c ps -a --label orchd.grove=ci -q)"
          echo "grown, seen running, felled, nothing left"
      - name: What CRI-O and the tree said
        if: failure()
        run: |
          sudo journalctl -u crio --no-pager | tail -60
          sudo sh -c "tail -50 $T/state/logs/*.log" || true
